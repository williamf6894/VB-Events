name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.0'
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet -v ./...

      - name: Test
        run: go test -v ./...

  node-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test --if-present

  docker-build:
    needs: [go-build, node-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Backend Docker image
        run: docker build ./backend --file Dockerfile --tag vb-events-backend:ci

      - name: Build the Frontend Docker image
        run: docker build ./frontend --file Dockerfile --tag vb-events-frontend:ci

      - name: Scan the Backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vb-events-backend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan the Frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vb-events-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vbevents
          POSTGRES_PASSWORD: vbevents
          POSTGRES_DB: events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vbevents -d events"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: vbevents
      DB_PASSWORD: vbevents
      DB_DATABASE: events
      API_PORT: "8200"
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.0'
          cache-dependency-path: backend/go.sum

      - name: Migrate and seed database
        run: go run ./cmd/seed

      - name: Start API and wait for health
        run: |
          nohup go run ./cmd > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8200/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8200/healthz

      - name: Run Newman tests
        run: npx -y newman run ../testing/postman/vb-events.postman_collection.json -e ../testing/postman/vb-events.postman_environment.json

      - name: Show API log on failure
        if: failure()
        run: cat api.log
