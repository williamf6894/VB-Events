name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.0'
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet -v ./...

      - name: Test
        run: go test -v ./...

  node-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test --if-present

  docker-build:
    needs: [go-build, node-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names and tag
        id: meta
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build the Backend Docker image
        run: >
          docker build ./backend --load
          --tag vb-events-backend:ci
          --tag ghcr.io/${{ steps.meta.outputs.repo }}-backend:${{ steps.meta.outputs.tag }}
          --tag ghcr.io/${{ steps.meta.outputs.repo }}-backend:latest

      - name: Build the Frontend Docker image
        run: >
          docker build ./frontend --load
          --tag vb-events-frontend:ci
          --tag ghcr.io/${{ steps.meta.outputs.repo }}-frontend:${{ steps.meta.outputs.tag }}
          --tag ghcr.io/${{ steps.meta.outputs.repo }}-frontend:latest

      - name: Scan the Backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vb-events-backend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan the Frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vb-events-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ghcr.io/${{ steps.meta.outputs.repo }}-backend:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/${{ steps.meta.outputs.repo }}-backend:latest
          docker push ghcr.io/${{ steps.meta.outputs.repo }}-frontend:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/${{ steps.meta.outputs.repo }}-frontend:latest

  deploy:
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: QA
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            set -e
            cd /srv/vb-events
            git pull --ff-only
            IMAGE_TAG=$IMAGE_TAG docker compose pull backend frontend
            IMAGE_TAG=$IMAGE_TAG docker compose up -d --no-build
            docker image prune -f
          "

  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vbevents
          POSTGRES_PASSWORD: vbevents
          POSTGRES_DB: events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vbevents -d events"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: vbevents
      DB_PASSWORD: vbevents
      DB_DATABASE: events
      API_PORT: "8200"
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.0'
          cache-dependency-path: backend/go.sum

      - name: Migrate and seed database
        run: go run ./cmd/seed

      - name: Start API and wait for health
        run: |
          nohup go run ./cmd > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8200/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8200/healthz

      - name: Run Newman tests
        run: npx -y newman run ../testing/postman/vb-events.postman_collection.json -e ../testing/postman/vb-events.postman_environment.json

      - name: Show API log on failure
        if: failure()
        run: cat api.log
