basePath: /
definitions:
  handlers.participantRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  models.Participant:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: Events management API
  title: VB-Events API
  version: "1.0"
paths:
  /participants:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Participant'
            type: array
        "500":
          description: Internal error
          schema:
            type: object
      summary: List all participants
      tags:
      - participants
    post:
      consumes:
      - application/json
      description: Registers a participant with a name and unique email
      parameters:
      - description: Participant to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.participantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Participant'
        "400":
          description: Invalid body, or missing name/email
          schema:
            type: object
        "409":
          description: Email already in use
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: Create a new participant
      tags:
      - participants
  /participants/{id}:
    delete:
      parameters:
      - description: Participant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
        "400":
          description: Invalid participant id
          schema:
            type: object
        "404":
          description: Participant not found
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: Delete a participant
      tags:
      - participants
    get:
      parameters:
      - description: Participant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Participant'
        "400":
          description: Invalid participant id
          schema:
            type: object
        "404":
          description: Participant not found
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: Get a participant by ID
      tags:
      - participants
    put:
      consumes:
      - application/json
      parameters:
      - description: Participant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated participant data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.participantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Participant'
        "400":
          description: Invalid body or id, or missing name/email
          schema:
            type: object
        "404":
          description: Participant not found
          schema:
            type: object
        "409":
          description: Email already in use
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: Update a participant
      tags:
      - participants
swagger: "2.0"
