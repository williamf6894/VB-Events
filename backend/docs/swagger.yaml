basePath: /
definitions:
  handlers.eventRequest:
    properties:
      capacity:
        type: integer
      description:
        type: string
      duration:
        type: number
      location:
        type: string
      name:
        type: string
      startTimestamp:
        format: date-time
        type: string
    type: object
  handlers.healthResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
    type: object
  handlers.participantRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        example: min 8 characters
        type: string
    type: object
  models.Event:
    properties:
      capacity:
        type: integer
      description:
        type: string
      duration:
        type: number
      id:
        type: string
      location:
        type: string
      name:
        type: string
      participants:
        items:
          $ref: '#/definitions/models.Participant'
        type: array
      startTimestamp:
        type: string
    type: object
  models.Participant:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  services.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  services.TokenResponse:
    properties:
      token:
        type: string
    type: object
info:
  contact: {}
  description: Events management API
  title: VB-Events API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Returns a signed JWT valid for 24 hours
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.TokenResponse'
        "400":
          description: Invalid request body
          schema:
            type: object
        "401":
          description: Invalid credentials
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: Log in with email and password
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Participant'
        "401":
          description: Not authenticated
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get the currently authenticated participant
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a participant account with a name, unique email and password
      parameters:
      - description: Participant to register
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.participantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Participant'
        "400":
          description: Invalid body, or missing name/email/password (min 8 chars)
          schema:
            type: object
        "409":
          description: Email already in use
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: Register a new participant
      tags:
      - auth
  /api/v1/events:
    get:
      description: All filters are optional and combine; results are ordered by start
        time
      parameters:
      - description: Partial, case-insensitive match on name, description or location
        in: query
        name: q
        type: string
      - description: RFC3339 timestamp — only events starting after this
        in: query
        name: after
        type: string
      - description: RFC3339 timestamp — only events starting before this
        in: query
        name: before
        type: string
      - description: 'Filter by fullness: true = only full events, false = only events
          with space remaining'
        in: query
        name: full
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Event'
            type: array
        "400":
          description: Invalid filter value
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: List events with optional filters
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Creates an event with a name and start timestamp
      parameters:
      - description: Event to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.eventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Event'
        "400":
          description: Invalid body, or missing name/startTimestamp
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create a new event
      tags:
      - events
  /api/v1/events/{id}:
    delete:
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
        "400":
          description: Invalid event id
          schema:
            type: object
        "404":
          description: Event not found
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Delete an event
      tags:
      - events
    get:
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Event'
        "400":
          description: Invalid event id
          schema:
            type: object
        "404":
          description: Event not found
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: Get an event by ID with its participants
      tags:
      - events
    put:
      consumes:
      - application/json
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.eventRequest'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Event'
        "400":
          description: Invalid body or id, or missing name/startTimestamp
          schema:
            type: object
        "404":
          description: Event not found
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update an event
      tags:
      - events
      - events
  /api/v1/events/{id}/participants:
    delete:
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
        "400":
          description: Invalid event id
          schema:
            type: object
        "401":
          description: Not authenticated
          schema:
            type: object
        "404":
          description: Event not found, or not registered
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Remove the current user's participation from an event
      tags:
      - events
    post:
      description: Adds the authenticated participant to the event if there is capacity
        remaining and they are not already registered
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
        "400":
          description: Invalid event id
          schema:
            type: object
        "401":
          description: Not authenticated
          schema:
            type: object
        "404":
          description: Event not found
          schema:
            type: object
        "409":
          description: Already registered, event is at capacity, or event has already
            started
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Register the current user as a participant of an event
      tags:
      - events
  /api/v1/events/{id}/participants/{participantId}:
    post:
      description: Demo endpoint — adds the given participant to the event, subject
        to the same rules as joining (capacity, start time, duplicates)
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Participant ID (UUID)
        in: path
        name: participantId
        required: true
        type: string
      responses:
        "204":
          description: No content
        "400":
          description: Invalid event or participant id
          schema:
            type: object
        "401":
          description: Not authenticated
          schema:
            type: object
        "404":
          description: Event or participant not found
          schema:
            type: object
        "409":
          description: Already registered, event is at capacity, or event has already
            started
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Add a specific participant to an event
      tags:
      - events
  /api/v1/events/name/{name}:
    get:
      parameters:
      - description: Event name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Event'
        "404":
          description: Event not found
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      summary: Find an event by exact name
      tags:
      - events
  /api/v1/participants:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Participant'
            type: array
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List all participants
      tags:
      - participants
  /api/v1/participants/{id}:
    delete:
      parameters:
      - description: Participant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
        "400":
          description: Invalid participant id
          schema:
            type: object
        "404":
          description: Participant not found
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Delete a participant
      tags:
      - participants
    get:
      parameters:
      - description: Participant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Participant'
        "400":
          description: Invalid participant id
          schema:
            type: object
        "404":
          description: Participant not found
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get a participant by ID
      tags:
      - participants
    put:
      consumes:
      - application/json
      parameters:
      - description: Participant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated participant data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.participantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Participant'
        "400":
          description: Invalid body or id, or missing name/email
          schema:
            type: object
        "404":
          description: Participant not found
          schema:
            type: object
        "409":
          description: Email already in use
          schema:
            type: object
        "500":
          description: Internal error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update a participant
      tags:
      - participants
  /healthz:
    get:
      description: Returns service status and verifies database connectivity
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.healthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.healthResponse'
      summary: Service health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
